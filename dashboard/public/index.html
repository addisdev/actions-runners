<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)">
<meta name="description" content="Local operations dashboard for self-hosted GitHub Actions runners.">
<title>Actions Runners</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="topbar">
  <div class="topbar-id">
    <span class="brand-symbol is-connecting" aria-hidden="true">
      <img class="brand-mark" src="/assets/fleet-mark.svg" alt="">
      <i class="brand-signal"></i>
    </span>
    <div class="brand-copy">
      <span class="brand-eyebrow">Actions Runners</span>
      <div class="host-line">
        <h1 id="host-name">fleet</h1>
        <span class="host-meta" id="host-meta"></span>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-active" id="tab-fleet" data-view="fleet" role="tab" aria-controls="view-fleet" aria-selected="true" tabindex="0"><span>Fleet</span></button>
    <button class="tab" id="tab-runs" data-view="runs" role="tab" aria-controls="view-runs" aria-selected="false" tabindex="-1"><span>Runs</span><b class="tab-badge" id="runs-badge" hidden></b></button>
    <button class="tab" id="tab-analytics" data-view="analytics" role="tab" aria-controls="view-analytics" aria-selected="false" tabindex="-1"><span>Analytics</span></button>
    <button class="tab" id="tab-lint" data-view="lint" role="tab" aria-controls="view-lint" aria-selected="false" tabindex="-1"><span>Lint</span></button>
    <button class="tab" id="tab-alerts" data-view="alerts" role="tab" aria-controls="view-alerts" aria-selected="false" tabindex="-1"><span>Alerts</span><b class="tab-badge is-warning" id="alerts-badge" hidden></b></button>
    <button class="tab" id="tab-capacity" data-view="capacity" role="tab" aria-controls="view-capacity" aria-selected="false" tabindex="-1"><span>Capacity</span></button>
    <button class="tab" id="tab-hosts" data-view="hosts" role="tab" aria-controls="view-hosts" aria-selected="false" tabindex="-1"><span>Hosts</span></button>
    <button class="tab" id="tab-control" data-view="control" role="tab" aria-controls="view-control" aria-selected="false" tabindex="-1"><span>Control</span></button>
  </nav>
  <div class="topbar-right">
    <span class="stale" id="stale"></span>
    <span class="connection" title="Live dashboard connection" aria-live="polite">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-label">Connecting</span>
    </span>
    <button class="theme-toggle" id="theme-toggle" title="Theme: system" aria-label="Theme: system">
      <span class="theme-icon theme-icon-moon" aria-hidden="true"></span>
      <span class="theme-icon theme-icon-sun" aria-hidden="true"></span>
    </button>
  </div>
</header>

<main id="main-content" tabindex="-1">
  <section class="federation-summary is-hidden" id="federation-summary" aria-label="Fleet federation summary"></section>
  <section class="kpis" id="kpis" aria-label="Fleet overview"></section>
  <section id="drift"></section>

  <div class="view" id="view-fleet" role="tabpanel" aria-labelledby="tab-fleet">
    <div class="glance-card" id="glance-card" aria-label="Fleet at a glance"></div>
    <section id="fleet">
      <div class="empty-state is-loading" role="status">
        <div class="empty-visual">
          <img src="/assets/empty-fleet.svg" alt="">
          <i class="scan-line" aria-hidden="true"></i>
        </div>
        <div>
          <span class="empty-eyebrow">Starting collector</span>
          <strong>Reading the fleet</strong>
          <p>Connecting local runners, GitHub state, and host telemetry.</p>
        </div>
      </div>
    </section>
    <section id="fleet-queue"></section>
    <section id="unserved"></section>
  </div>

  <div class="view is-hidden" id="view-runs" role="tabpanel" aria-labelledby="tab-runs" aria-hidden="true">
    <section id="active"></section>
    <section id="recent"></section>
  </div>

  <div class="view is-hidden" id="view-analytics" role="tabpanel" aria-labelledby="tab-analytics" aria-hidden="true"></div>

  <div class="view is-hidden" id="view-lint" role="tabpanel" aria-labelledby="tab-lint" aria-hidden="true"></div>

  <div class="view is-hidden" id="view-alerts" role="tabpanel" aria-labelledby="tab-alerts" aria-hidden="true"></div>

  <div class="view is-hidden" id="view-capacity" role="tabpanel" aria-labelledby="tab-capacity" aria-hidden="true"></div>

  <div class="view is-hidden" id="view-hosts" role="tabpanel" aria-labelledby="tab-hosts" aria-hidden="true"></div>

  <div class="view is-hidden" id="view-control" role="tabpanel" aria-labelledby="tab-control" aria-hidden="true"></div>
</main>

<div class="drawer" id="drawer" aria-hidden="true" hidden>
  <div class="drawer-scrim" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="Runner detail" tabindex="-1">
    <button class="drawer-close" data-close aria-label="Close">×</button>
    <div id="drawer-body"></div>
  </aside>
</div>

<!-- Bottom navigation (shown only on small screens via CSS) -->
<nav class="bottom-nav" id="bottom-nav" role="tablist" aria-label="Navigation">
  <button class="bnav-btn is-active" id="bnav-fleet" data-view="fleet" role="tab" aria-selected="true">
    <span class="bnav-icon" aria-hidden="true">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="8" width="7" height="13" rx="1.5"/><rect x="10" y="3" width="11" height="18" rx="1.5"/></svg>
    </span>Fleet
  </button>
  <button class="bnav-btn" id="bnav-runs" data-view="runs" role="tab" aria-selected="false">
    <span class="bnav-icon" aria-hidden="true">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><polyline points="5 12 12 5 19 12"/><polyline points="5 19 12 12 19 19"/></svg>
      <b class="bnav-badge" id="bnav-runs-badge" hidden></b>
    </span>Runs
  </button>
  <button class="bnav-btn" id="bnav-alerts" data-view="alerts" role="tab" aria-selected="false">
    <span class="bnav-icon" aria-hidden="true">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <b class="bnav-badge is-warning" id="bnav-alerts-badge" hidden></b>
    </span>Alerts
  </button>
  <button class="bnav-btn" id="bnav-hosts" data-view="hosts" role="tab" aria-selected="false">
    <span class="bnav-icon" aria-hidden="true">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
    </span>Hosts
  </button>
  <button class="bnav-btn" id="bnav-more" data-view="more">
    <span class="bnav-icon" aria-hidden="true">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </span>More
  </button>
</nav>

<!-- More sheet (secondary tabs on mobile) -->
<div class="more-sheet" id="more-sheet">
  <div class="more-sheet-scrim" id="more-sheet-scrim"></div>
  <div class="more-sheet-panel">
    <strong>More</strong>
    <div class="more-sheet-grid">
      <button class="more-sheet-btn" data-view="analytics">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Analytics
      </button>
      <button class="more-sheet-btn" data-view="lint">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Lint
      </button>
      <button class="more-sheet-btn" data-view="capacity">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
        Capacity
      </button>
      <button class="more-sheet-btn" data-view="control">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Control
      </button>
    </div>
  </div>
</div>

<footer class="footer" id="footer"></footer>
<script src="/app.js" type="module"></script>
</body>
</html>
