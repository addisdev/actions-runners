<text x="566" y="166" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="end">15 s while building · 45 s asleep</text>
<text x="754" y="150" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start">backfill</text>
<text x="754" y="166" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">10 min · 350 calls a pass · floor 1500</text>
