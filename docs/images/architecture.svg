<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="Architecture of the actions-runners fleet: GitHub above, one Mac running the runner LaunchAgents and the fleetd daemon, and a browser dashboard below.">
