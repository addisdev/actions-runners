<text x="72" y="196" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">macOS host</text>
<text x="168" y="196" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">Apple Silicon · your hardware · one user account</text>
<text x="1208" y="196" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="end">everything inside runs under launchd</text>
