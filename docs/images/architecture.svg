<text x="460" y="702" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="13" font-weight="700" fill="#ffffff" text-anchor="start">BROWSER DASHBOARD</text>
<text x="460" y="724" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">Fleet · Runs · Analytics · Lint · Alerts · Control</text>
<polyline points="600,620 600,670" fill="none" stroke="#898781" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="588" y="650" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="end">SSE /api/stream</text>
<polyline points="690,670 690,626" fill="none" stroke="#898781" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="702" y="650" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start">POST /api/action · bearer</text>
<text x="640" y="772" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="middle">an action is execFile with an argv array — no shell, no free-form commands, every one recorded, refused or not</text>
<circle cx="1000" cy="700" r="3" fill="#0ca30c"/>
<text x="1010" y="704" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">a runner listening</text>
<line x1="992" y1="724" x2="1008" y2="724" stroke="#3987e5" stroke-width="1.5"/>
<text x="1014" y="728" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">the daemon</text>
