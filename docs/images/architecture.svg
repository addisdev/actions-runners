<text x="100" y="386" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">one per repo, each its own directory —</text>
<text x="100" y="403" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">a second only where a workflow has >1 job</text>
<text x="100" y="424" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">idle listeners are nearly free (~7 MB each);</text>
<text x="100" y="441" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">two simultaneous Xcode builds are not</text>
<text x="100" y="468" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">runsvc.sh → RunnerService.js → listener → worker</text>
<text x="100" y="488" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">job hooks: admission gate on start, drain on completion</text>
<rect x="80" y="514" width="350" height="92" rx="10" fill="#1a1a19" stroke="#2c2c2a" stroke-width="1"/>
<text x="100" y="542" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start" letter-spacing="0.8">LOCAL PROBES</text>
<text x="100" y="566" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">launchctl list · ps · vm_stat · df</text>
<text x="100" y="590" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">Runner.Worker present? → poll fast. Free; no API call.</text>
<polyline points="255,500 255,508" fill="none" stroke="#898781" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="470" y="222" width="740" height="374" rx="10" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/>
<text x="494" y="250" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">fleetd.js</text>
<text x="590" y="250" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">one process, two jobs — on purpose</text>
<rect x="494" y="296" width="330" height="100" rx="8" fill="#232322" stroke="#2c2c2a" stroke-width="1"/>
<text x="512" y="322" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start" letter-spacing="0.8">COLLECTOR</text>
<text x="512" y="346" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">GitHub API + local probes</text>
<text x="512" y="366" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">fast · slow 15 min (roster, du) · backfill</text>
<text x="512" y="384" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">abstains on state it has not read — never guesses</text>
<rect x="856" y="296" width="330" height="100" rx="8" fill="#232322" stroke="#2c2c2a" stroke-width="1"/>
<text x="874" y="322" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start" letter-spacing="0.8">SERVER</text>
<text x="874" y="346" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">127.0.0.1:7878 — loopback by default</text>
<text x="874" y="366" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">/api/state · /api/stream (SSE) · /api/lint</text>
<text x="874" y="384" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">reads are open; every action needs the bearer token</text>
<rect x="494" y="420" width="692" height="52" rx="8" fill="#232322" stroke="#2c2c2a" stroke-width="1"/>
<text x="512" y="442" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start" letter-spacing="0.8">SNAPSHOT · IN MEMORY</text>
<text x="512" y="462" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">the collector writes it, the server reads it — no polling between them</text>
<rect x="494" y="496" width="692" height="80" rx="8" fill="#232322" stroke="#2c2c2a" stroke-width="1"/>
<text x="512" y="520" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="600" fill="#c3c2b7" text-anchor="start" letter-spacing="0.8">SQLITE · fleet.db</text>
<text x="660" y="520" font-family='ui-monospace, SFMono-Regular, Menlo, monospace' font-size="11" font-weight="400" fill="#898781" text-anchor="start">node:sqlite — zero dependencies, no build step</text>
<text x="512" y="542" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" font-weight="400" fill="#ffffff" text-anchor="start">runs · jobs · runner state · host samples · queue events · admission log</text>
<text x="512" y="562" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11" font-weight="400" fill="#898781" text-anchor="start">append-only, kept forever — GitHub discards run detail after 90 days</text>
