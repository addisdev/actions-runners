name: docs

# Builds the documentation site and publishes it to GitHub Pages.
#
# `--strict` is the point: MkDocs treats a link to a page that does not exist as
# a warning by default, and this turns those into a failed build. This handbook
# is nineteen pages that link to each other constantly, and scripts/check-docs.sh
# can only see the Markdown — it cannot see a nav entry pointing at a file that
# was renamed.
#
# lychee then checks what MkDocs cannot: the external links, and the links from
# the READMEs that never pass through MkDocs at all.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "examples/**"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          # setup-python's pip cache needs a dependency file to key on, and
          # fails outright without one rather than skipping the cache.
          cache-dependency-path: requirements-docs.txt

      - run: pip install -r requirements-docs.txt

      # The workflow guide includes examples/*.yml verbatim via the snippets
      # extension, so a renamed example fails the build here as well as failing
      # the release check.
      - name: Build
        run: mkdocs build --strict

      - name: Check links
        uses: lycheeverse/lychee-action@82202e5e9c2f4ef1a55a3d02563e1cb6041e5332  # v2.4.1
        with:
          # The built HTML rather than the Markdown: this way the snippet
          # includes and the nav are checked as a reader would meet them.
          #
          # compare/ and releases/tag/ are excluded because CHANGELOG.md names
          # the version being released in the same commit that releases it.
          # That tag does not exist until after this workflow has passed, so
          # checking them means a release can never be prepared without a red
          # build.
          args: >-
            --no-progress
            --max-concurrency 8
            --exclude '^https://github\.com/addisdev/actions-runners/(edit|tree|blob)/'
            --exclude '^https://addisdev\.github\.io/'
            --exclude '^https?://(127\.0\.0\.1|localhost|\[::1\])(:|/|$)'
            --exclude '^https?://[^/]*\.local(:|/|$)'
            --exclude '^https://github\.com/addisdev/actions-runners/(compare|releases/tag)/'
            --accept 200,206,429
            site/**/*.html README.md CHANGELOG.md dashboard/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v3.0.1
        with:
          path: site

  deploy:
    # Only main publishes; a pull request builds and link-checks without
    # touching the live site.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
