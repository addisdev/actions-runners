version: 2
updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # Optional escalation subtree (the only npm dependency in the project)
  - package-ecosystem: npm
    directory: /dashboard/autofix/escalate
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(escalate)"
    labels:
      - "dependencies"
      - "third-party"
    # The escalate subtree is opt-in — don't merge its updates automatically.
    open-pull-requests-limit: 5
