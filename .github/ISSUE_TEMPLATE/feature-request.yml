name: Feature request
description: Suggest a new feature or enhancement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please read [CONTRIBUTING.md](
        https://github.com/addisdev/actions-runners/blob/main/CONTRIBUTING.md)
        to understand the project's scope. Things that do not fit: cloud
        autoscaling, Kubernetes, runtime npm dependencies, Linux/Windows support.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the problem you are trying to solve. A concrete example is more
        useful than a abstract feature description.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this one
          required: true
        - label: I have read CONTRIBUTING.md and believe this fits the project scope
          required: true
